name: Performance

# The macrobenchmark + Perfetto harness from docs/PERFORMANCE.md. Emulator numbers are
# comparisons between builds, never the phone's acceptance numbers (docs/ACCEPTANCE.md),
# so this runs on demand and on pull requests labelled `performance` — not on every push.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Macrobenchmark and Perfetto trace
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'performance'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM makes the emulator usable; without it the benchmark would time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ vars.PERF_API_LEVEL || 36 }}

      - name: Create AVD if it was not cached
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ vars.PERF_API_LEVEL || 36 }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader_indirect
          disable-animations: false
          script: echo "AVD created"

      # This installs and UNINSTALLS dev.pluto.launcher (with its data) on the emulator it
      # runs on: the benchmark needs a clean, fixture-driven install. Never point it at a
      # device you use.
      - name: Benchmark and trace
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ vars.PERF_API_LEVEL || 36 }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader_indirect
          disable-animations: false
          script: |
            set -e
            ANDROID_SERIAL=emulator-5554 ./gradlew --console=plain :baselineprofile:connectedBenchmarkReleaseAndroidTest
            scripts/perfetto-capture.sh --serial emulator-5554 --out artifacts/perfetto

      - name: Check for a startup regression
        run: |
          python3 scripts/check-benchmark-regression.py \
            --baseline docs/performance/emulator-baseline-startup.json \
            --results baselineprofile/build/outputs \
            --out artifacts/benchmark-summary.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: |
            artifacts/**
            baselineprofile/build/outputs/**
          if-no-files-found: warn
